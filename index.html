<!doctype html><html lang='zh-HK'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>澪の生活情報板</title><style>
:root{--bg:#f3eee5;--card:#fffaf2;--ink:#27312f;--muted:#78807b;--sage:#cfdccf;--blue:#dbe8ee;--peach:#f1d5c7;--line:#ded8cd;--accent:#58756a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans TC',sans-serif;transition:.4s}body.night{--bg:#111923;--card:#1c2732;--ink:#f5f0e8;--muted:#a9b5bd;--sage:#2c4b43;--blue:#233d50;--peach:#5a3e3d;--line:#34434e;--accent:#9bc7b7}.wrap{max-width:1180px;margin:auto;padding:26px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.time{font-size:56px;font-weight:700;letter-spacing:-2px}.date,.muted{color:var(--muted)}.london{text-align:right}.grid{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.035)}.wide{grid-column:span 2}.weather{display:flex;gap:16px}.weather>div{flex:1;padding:14px;border-radius:16px;background:var(--blue)}h3{margin:0 0 12px;font-size:14px;letter-spacing:1.5px}.big{font-size:32px;font-weight:700}.train{background:var(--sage)}.trains{display:flex;gap:12px}.trainpill{flex:1;background:rgba(255,255,255,.35);border-radius:14px;padding:13px;text-align:center}.mins{font-size:24px;font-weight:750}.jp{background:var(--peach)}.jpword{font-size:28px;font-weight:700}.trip{text-align:center}.days{font-size:46px;font-weight:800}.schedule .item{padding:8px 0;border-bottom:1px solid var(--line)}.schedule .item:last-child{border:0}.catcard{display:flex;gap:18px;align-items:center;min-height:180px}.cat{font-size:76px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.12))}.quote{font-size:20px;line-height:1.55}.footer{text-align:center;color:var(--muted);padding:18px 0 2px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.time{font-size:44px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.top{gap:15px}.weather{flex-direction:column}.time{font-size:38px}}
</style></head><body><main class='wrap'><header class='top'><div><div class='time' id='hkTime'>--:--</div><div class='date' id='date'></div><div class='muted'>HONG KONG</div></div><div class='london'><div class='big' id='ldnTime'>--:--</div><div class='muted'>LONDON 🇬🇧</div></div></header><section class='grid'>
<div class='card wide'><h3>WEATHER</h3><div class='weather'><div><b>🇭🇰 HONG KONG</b><div class='big' id='hkTemp'>天氣載入中…</div><div class='muted' id='hkWeather'></div></div><div><b>🇯🇵 FUKUOKA</b><div class='big' id='fkTemp'>天氣載入中…</div><div class='muted' id='fkWeather'></div></div></div></div>
<div class='card trip'><h3>NEXT TRIP ✈️</h3><div>KYOTO</div><div class='days' id='days'>--</div><div class='muted'>DAYS TO GO</div></div>
<div class='card train wide'><h3>🚇 康城 LOHAS PARK</h3><div class='muted'>將軍澳綫 · 最近班次</div><div class='trains' id='trains'><div class='trainpill'>即時資料接駁中</div></div></div>
<div class='card jp'><h3>🇯🇵 今日の日本語</h3><div class='jpword' id='jpword'></div><div id='jpreading'></div><div class='muted' id='jpmeaning'></div></div>
<div class='card schedule'><h3>📅 TODAY</h3><div id='schedule'></div></div>
<div class='card'><h3>✓ 今日三件事</h3><div class='schedule' id='todos'></div></div>
<div class='card wide catcard'><div class='cat' id='cat'>🐈</div><div><h3>今日的小事</h3><div class='quote' id='quote'></div></div></div>
</section><div class='footer'>澪の生活情報板 · 日間 / 夜間 06:00 自動切換</div></main><script>
const pad=n=>String(n).padStart(2,'0');
function clocks(){const now=new Date(); document.getElementById('hkTime').textContent=new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);document.getElementById('ldnTime').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false}).format(now);document.getElementById('date').textContent=new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',month:'long',day:'numeric',weekday:'long'}).format(now);let h=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',hour12:false}).format(now));document.body.classList.toggle('night',h<6||h>=18)}clocks();setInterval(clocks,1000);
async function weather(lat,lon,t,m){try{let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);let j=await r.json();let code=j.current.weather_code;let desc=code===0?'晴朗':code<4?'部分多雲':code<60?'多雲':code<80?'有雨':'雷雨';document.getElementById(t).textContent=`${Math.round(j.current.temperature_2m)}°C`;document.getElementById(m).textContent=`${desc} · ${Math.round(j.daily.temperature_2m_max[0])}° / ${Math.round(j.daily.temperature_2m_min[0])}° · 降雨 ${j.daily.precipitation_probability_max[0]??'--'}%`}catch(e){document.getElementById(t).textContent='暫未取得';}}
weather(22.3193,114.1694,'hkTemp','hkWeather');weather(33.5902,130.4017,'fkTemp','fkWeather');setInterval(()=>{weather(22.3193,114.1694,'hkTemp','hkWeather');weather(33.5902,130.4017,'fkTemp','fkWeather')},600000);
const words=[['予定','よてい','預定、計劃'],['散歩','さんぽ','散步'],['美術館','びじゅつかん','美術館'],['喫茶店','きっさてん','咖啡店'],['写真','しゃしん','相片／攝影']];const quotes=['仲有 3 分鐘有車。呢個唔係倒數，係警告。🚇','今日冇行程。唔代表需要立即安排一堆行程。','今日適合飲咖啡。雖然其實每日都適合。☕️','做唔晒唔緊要，聽日嘅你仍然有返工。😹','有啲事慢慢做，唔代表冇向前行。'];const cats=['🐈','🐈‍⬛','😺','😸','😽'];let day=Math.floor(Date.now()/86400000);let i=day%words.length,q=day%quotes.length,c=day%cats.length;[jpword,jpreading,jpmeaning].forEach((e,n)=>e.textContent=words[i][n]);quote.textContent=quotes[q];cat.textContent=cats[c];
const target=new Date('2026-10-15T00:00:00+09:00');days.textContent=Math.max(0,Math.ceil((target-Date.now())/86400000));
const events=['今日暫時冇固定行程 ☁️'];schedule.innerHTML=events.map(x=>`<div class='item'>${x}</div>`).join('');const tasks=['讀一陣書','整理幾張相','飲杯咖啡 ☕️'];todos.innerHTML=tasks.map(x=>`<div class='item'>${x}</div>`).join('');
async function mtr(){try{let r=await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TKL&sta=LHP');let j=await r.json();let key='TKL-LHP',data=j.data?.[key];let arr=[...(data?.UP||[]),...(data?.DOWN||[])].sort((a,b)=>(a.time||'').localeCompare(b.time||'')).slice(0,3);if(!arr.length)throw 0;let now=new Date();trains.innerHTML=arr.map(x=>{let d=new Date(x.time.replace(' ','T')+'+08:00');let min=Math.max(0,Math.round((d-now)/60000));return `<div class='trainpill'><div class='mins'>${min} MIN</div><small>${x.dest||''} · ${x.time?.slice(11,16)||''}</small></div>`}).join('')}catch(e){trains.innerHTML='<div class="trainpill">暫未取得港鐵即時資料</div>'}}mtr();setInterval(mtr,20000);
</script></body></html>
